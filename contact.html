<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
	<link rel="icon" type="image/x-icon" href="favicano.ico">
</head>

<body>
<table width="1200" border="1" align="center">
  <tbody>
    <tr>
      <td width="42">Index</td>
      <td width="98">Gastronomy </td>
      <td width="55">Sports </td>
      <td width="60">Culture </td>
      <td width="82">Life quality</td>
      <td width="53">Nature</td>
      <td width="64">Contact</td>
    </tr>
    <tr>
      <td colspan="7" align="center">Contact</td>
    </tr>
    <tr>
      <td>Full Name </td>
      <td colspan="3"><label for="textfield">Name :</label>
      <input name="textfield" type="text" id="textfield" maxlength="20"></td>
      <td colspan="3"><label for="textfield2">Last Name:</label>
      <input name="textfield2" type="text" id="textfield2" maxlength="40"></td>
    </tr>
    <tr>
      <td>Personal phone </td>
      <td colspan="6"><label for="tel">Tel:</label>
      <input name="tel" type="tel" id="tel" maxlength="50"></td>
    </tr>
    <tr>
      <td>address</td>
      <td colspan="6"><label for="textfield3">address:</label>
      <input name="textfield3" type="text" id="textfield3" maxlength="200"></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td colspan="6"><label for="textfield4">cross streets:</label>
      <input type="text" name="textfield4" id="textfield4"></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td colspan="3"><label for="textfield5">city:</label>
      <input type="text" name="textfield5" id="textfield5"></td>
      <td colspan="3"><label for="textfield6">state:</label>
      <input type="text" name="textfield6" id="textfield6"></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td colspan="3"><label for="textfield7">postal code:</label>
      <input type="text" name="textfield7" id="textfield7"></td>
      <td colspan="3"><label for="select">country:</label>
        <select name="select" id="select">
          <option>america</option>
          <option>mexico</option>
          <option>sweden</option>
          <option>germany</option>
          <option>spain</option>
          <option>brazil</option>
      </select></td>
    </tr>
    <tr>
      <td>Sex</td>
      <td colspan="6"><p>
        <label>
          <input type="radio" name="sex" value="radio" id="sex_0">
          women </label>
        <br>
        <label>
          <input type="radio" name="sex" value="radio" id="sex_1">
          men </label>
        <br>
      </p></td>
    </tr>
    <tr>
      <td>Marital status </td>
      <td colspan="6"><p>
        <label>
          <input type="radio" name="marital status " value="radio" id="maritalstatus_0">
          single </label>
        <br>
        <label>
          <input type="radio" name="marital status " value="radio" id="maritalstatus_1">
          married </label>
        <br>
        <label>
          <input type="radio" name="marital status " value="radio" id="maritalstatus_2">
          divorced</label>
        <br>
      </p></td>
    </tr>
    <tr>
      <td>email</td>
      <td colspan="6"><label for="email">Email:</label>
      <input type="email" name="email" id="email"></td>
    </tr>
    <tr>
      <td>date of birth</td>
      <td colspan="6"><label for="date">Date:</label>
      <input type="date" name="date" id="date"></td>
    </tr>
    <tr>
      <td>Place of birth </td>
      <td colspan="6">place of birth 
        <input type="text" name="textfield9" id="textfield9"></td>
    </tr>
    <tr>
      <td>citizenship</td>
      <td colspan="6"><label for="textfield10">citizenship:</label>
      <input type="text" name="textfield10" id="textfield10"></td>
    </tr>
    <tr>
      <td>account name </td>
      <td colspan="6"><label for="textfield11">account name:</label>
      <input type="text" name="textfield11" id="textfield11"></td>
    </tr>
    <tr>
      <td>password</td>
      <td colspan="6"><label for="password">Password:</label>
      <input type="password" name="password" id="password"></td>
    </tr>
    <tr>
      <td colspan="7"><input type="submit" name="submit" id="submit" value="Submit"></td>
    </tr>
  </tbody>
</table>
</body>
</html>
